# Merge into the existing HTTPS server block after backing it up.
location = /gallery {
    return 301 /gallery/;
}

location ^~ /gallery/api/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:8200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
}

location /gallery/ {
    root /var/www/cloud-gallery;
    try_files $uri $uri/ /gallery/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}

# Never add a location exposing /var/lib/cloud-gallery/images.

